name: Bug report
description: Report a reproducible problem using synthetic media.
title: "[Bug] "
labels: []
body:
  - type: markdown
    attributes:
      value: "Remove personal filenames and paths. Do not attach private videos, credentials or unredacted dumps."
  - type: input
    id: version
    attributes:
      label: App version and operating system
    validations:
      required: true
  - type: textarea
    id: steps
    attributes:
      label: Reproduction steps and source codec
      description: Include selected detail, duration, size fitting and GPU mode.
    validations:
      required: true
  - type: textarea
    id: behavior
    attributes:
      label: Expected and actual behavior
    validations:
      required: true
  - type: textarea
    id: safe_example
    attributes:
      label: Synthetic example or redacted screenshot
